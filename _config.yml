  links:
    - label: "Email"
      icon: "fas fa-fw fa-envelope"
      url: "mailto:ignaciomrrd.es@gmail.com"
    - label: "Twitter"
      icon: "fab fa-fw fa-twitter"
      url: "https://twitter.com/isatelite4_"
